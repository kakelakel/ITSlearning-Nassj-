sync_calendar:
  fields:
    target_calendar:
      required: true
      selector:
        entity:
          domain: calendar
    include:
      default:
        - deadlines
      selector:
        select:
          multiple: true
          translation_key: include
          options:
            - deadlines
            - schedule
    days_ahead:
      default: 14
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: dagar
