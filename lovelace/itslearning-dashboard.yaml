# itslearning – skolpanel
# Inställningar → Instrumentpaneler → Lägg till instrumentpanel → "Ny från början"
# → öppna den → ⋮ → Redigera → ⋮ → Raw-konfigurationsredigerare → klistra in allt.
# Byt "preset" på korten för en annan stil (glass, neon, minimal, solid, notebook,
# sunset, ocean, midnight) eller ta bort raden för att följa ditt tema.
title: Skola
views:
  - title: Skola
    path: skola
    icon: mdi:school
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:itslearning-card
            view: chips
            preset: glass
      - type: grid
        cards:
          - type: custom:itslearning-card
            view: today
            preset: glass
          - type: custom:itslearning-card
            view: tomorrow
            preset: glass
      - type: grid
        cards:
          - type: custom:itslearning-card
            view: homework
            preset: glass
          - type: custom:itslearning-card
            view: news
            preset: glass
            max_items: 6
      - type: grid
        cards:
          - type: custom:itslearning-card
            view: week
            preset: glass
          - type: custom:itslearning-card
            view: areas
            preset: glass
          - type: calendar
            initial_view: listWeek
            entities:
              - calendar.itslearning_events
              - calendar.itslearning_deadlines
          - type: tile
            entity: script.itslearning_synka_google
            name: Synka till Google nu
            icon: mdi:calendar-sync
            tap_action:
              action: perform-action
              perform_action: script.itslearning_synka_google
