# itslearning – synk till Google Kalender + läxpåminnelse
#
# 1. Lägg till i configuration.yaml (om det inte redan finns):
#      homeassistant:
#        packages: !include_dir_named packages
# 2. Kopiera den här filen till config/packages/itslearning.yaml
# 3. Byt calendar.DIN_GOOGLE_KALENDER och notify.mobile_app_DIN_TELEFON nedan.
# 4. Starta om Home Assistant (eller Utvecklarverktyg → YAML → ladda om allt).

script:
  itslearning_synka_google:
    alias: "itslearning: synka till Google Kalender"
    icon: mdi:calendar-sync
    sequence:
      - action: itslearning.sync_calendar
        data:
          target_calendar: calendar.DIN_GOOGLE_KALENDER   # ← byt
          include:
            - deadlines       # uppgifter med deadline
            - events          # läxförhör, prov och andra händelser
            # - plans         # ta bort # om även lektionsplaneringen ska in
          days_ahead: 14
        response_variable: result
      - action: persistent_notification.create
        data:
          title: itslearning → Google
          message: >-
            {{ result.created }} nya händelser, {{ result.already_there }} fanns redan
            {%- if result.failed %}, {{ result.failed }} misslyckades (se loggen){% endif %}.

automation:
  - id: itslearning_synka_till_google_kalender
    alias: "itslearning: synka till Google Kalender"
    description: Lägger in nya deadlines, läxförhör och prov i Google Kalender varje timme.
    triggers:
      - trigger: time_pattern
        minutes: "17"
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:01:00"
      - action: itslearning.sync_calendar
        data:
          target_calendar: calendar.DIN_GOOGLE_KALENDER   # ← byt
          include:
            - deadlines
            - events
            # - plans
          days_ahead: 14
    mode: single

  - id: itslearning_laxpaminnelse
    alias: "itslearning: påminnelse om i morgon"
    description: Kl. 18 – läxförhör, prov, deadlines och planering för i morgon.
    triggers:
      - trigger: time
        at: "18:00:00"
    conditions:
      - condition: template
        value_template: >-
          {% set d = state_attr('sensor.itslearning_tomorrow', 'events') or [] %}
          {% set t = state_attr('sensor.itslearning_tomorrow', 'tasks') or [] %}
          {{ (d + t) | count > 0 }}
    actions:
      - action: notify.mobile_app_DIN_TELEFON   # ← byt
        data:
          title: I morgon i skolan
          message: |
            {% for e in state_attr('sensor.itslearning_tomorrow', 'events') or [] %}
            📝 {{ e.subject or e.course }}: {{ e.title }}{% if e.description %} – {{ e.description[:80] }}{% endif %}
            {% endfor %}
            {% for t in state_attr('sensor.itslearning_tomorrow', 'tasks') or [] %}
            📚 {{ t.title }} ({{ t.subject }}) – lämnas {{ t.deadline_local[11:] }}
            {% endfor %}
            {% for p in state_attr('sensor.itslearning_tomorrow', 'plans') or [] %}
            📖 {{ p.subject }}: {{ p.name }}
            {% endfor %}
    mode: single
